name: CI/CD Pipeline

# Runs automatically on every push and pull request. The pipeline FAILS (red build) when
# static analysis or the SonarQube quality gate fails, any backend/frontend test fails, a
# build fails, the containers do not become healthy, or the Newman / Playwright
# integration tests fail.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SONAR_TOKEN, SONAR_HOST_URL            SonarQube / SonarQube Cloud (see README section 6)
# No other secret is needed: JWT/Mongo/demo passwords are generated fresh in every run.
# Optional repository secrets (cloud logging evidence from the pipeline, see monitoring/README.md):
#   LOKI_URL, LOKI_USER, LOKI_API_KEY
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - install, lint, test, build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/hustlehub_test
    defaults:
      run:
        working-directory: "backend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static analysis (ESLint + security plugin) - fails on errors
        run: npm run lint

      - name: Static analysis report (evidence)
        if: always()
        run: |
          npm run lint:report || true
          cat reports/static-analysis-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload static analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-backend
          path: "backend/reports/"
          if-no-files-found: warn

      - name: Run backend tests (unit + API integration, with coverage)
        run: npm run test:ci

      - name: Make LCOV paths repo-relative (needed by SonarQube)
        run: sed -i -E 's#^SF:(\./)?(src|tests)/#SF:backend/\2/#' coverage/lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: "backend/coverage/"
          if-no-files-found: ignore

      - name: Build backend
        run: npm run build

      # Fails the job on CRITICAL vulnerabilities in production dependencies.
      # Lower the level to "high" once the findings below it are remediated.
      - name: Dependency vulnerability scan (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    name: Frontend - install, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "frontend"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Static analysis (ESLint) - fails on errors
        run: npm run lint

      - name: Static analysis report (evidence)
        if: always()
        run: |
          npm run lint:report || true
          cat reports/static-analysis-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload static analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-frontend
          path: "frontend/reports/"
          if-no-files-found: warn

      - name: Run frontend unit tests (Vitest, with coverage)
        run: npm run test:ci

      - name: Make LCOV paths repo-relative (needed by SonarQube)
        run: sed -i -E 's#^SF:(\./)?src/#SF:frontend/src/#' coverage/lcov.info

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: "frontend/coverage/"
          if-no-files-found: ignore

      - name: Build frontend
        run: npm run build

      - name: Dependency vulnerability scan (fails on critical)
        run: npm audit --omit=dev --audit-level=critical

  sonarqube:
    name: SonarQube - analysis + quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history gives SonarQube accurate blame / new-code detection

      - name: Check SonarQube secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::Add the repository secrets SONAR_TOKEN and SONAR_HOST_URL (see README section 6)."
            exit 1
          fi

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: "backend/coverage"

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: "frontend/coverage"

      # qualitygate.wait makes this step FAIL when the SonarQube quality gate fails.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  secret-scan:
    name: Secret scan (gitleaks) - fails if a credential is committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the checked-out files for passwords, API keys, tokens and private keys.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source /repo --config /repo/.gitleaks.toml --no-git --redact --verbose --exit-code 1

  docker:
    name: Docker - containers, Newman API tests, Playwright E2E tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Every credential is generated for this run only (nothing is stored in the repository).
      - name: Create .env for the stack
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USER: ${{ secrets.LOKI_USER }}
          LOKI_API_KEY: ${{ secrets.LOKI_API_KEY }}
        run: |
          DEMO_PASSWORD="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "MONGO_USER=hustlehub"
            echo "MONGO_PASSWORD=$(openssl rand -hex 16)"
            echo "SEED_PASSWORD=$DEMO_PASSWORD"
            echo "AUTH_RATE_LIMIT_MAX=1000"
            echo "BOOKING_RATE_LIMIT_MAX=1000"
            echo "LOKI_URL=$LOKI_URL"
            echo "LOKI_USER=$LOKI_USER"
            echo "LOKI_API_KEY=$LOKI_API_KEY"
            echo "LOKI_ENV=ci"
          } > .env
          # Passed to the Newman and Playwright steps below.
          echo "NEWMAN_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build and start the containerised stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Container proof + smoke test (client -> nginx -> API -> MongoDB)
        run: |
          mkdir -p evidence
          docker compose ps | tee evidence/docker-compose-ps.txt
          curl --fail --silent --show-error http://localhost:8080/api/health | tee evidence/health.json
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/

      # Newman runs the Postman collection against the API inside the running container
      # (published on https://localhost:5000). `npm run test:api` exits non-zero on any failed
      # assertion, which fails this step and therefore the pipeline.
      - name: API integration tests (Newman / Postman collection)
        working-directory: "backend"
        run: |
          npm install --no-audit --no-fund
          npm run test:api
          mkdir -p "$GITHUB_WORKSPACE/evidence"
          cp postman/newman-report.json "$GITHUB_WORKSPACE/evidence/newman-report.json"

      - name: Seed demo data (needed by the Playwright tests)
        run: docker compose run --rm api npm run seed

      - name: Install Playwright
        working-directory: "frontend"
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Frontend integration tests (Playwright against the running containers)
        working-directory: "frontend"
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test

      - name: Capture API logs (logging evidence)
        if: always()
        run: |
          mkdir -p evidence
          docker compose exec -T api sh -c "tail -n 40 logs/security.log" > evidence/security.log.txt || true
          docker compose logs --no-color --tail=300 > evidence/container-logs.txt || true

      - name: Upload evidence (container proof, Newman, logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-evidence
          path: evidence/
          if-no-files-found: warn

      - name: Upload Playwright report (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
