# SonarQube / SonarQube Cloud configuration (read by the "sonarqube" job in .github/workflows/ci.yml).
# 1. Create the project in SonarQube and copy its project key below (and the organization key
#    if you use SonarQube Cloud - uncomment the organization line).
# 2. Add the repository secrets SONAR_TOKEN and SONAR_HOST_URL
#    (SonarQube Cloud: https://sonarcloud.io ; self-hosted: your server URL).
sonar.projectKey=CHANGE_ME_project-key
sonar.projectName=HustleHub+ (INSY7314 Group 17)
#sonar.organization=CHANGE_ME_organization-key

sonar.projectBaseDir=.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/tests,frontend/e2e
sonar.test.inclusions=**/tests/**,**/e2e/**,**/*.test.js,**/*.test.jsx,**/*.spec.js
# src/tests is excluded from the *main* code (it is analysed as test code via sonar.tests).
sonar.exclusions=**/src/tests/**,**/node_modules/**,**/coverage/**,**/dist/**,**/reports/**,**/playwright-report/**,**/test-results/**
sonar.coverage.exclusions=**/tests/**,**/e2e/**,**/src/utils/seed.js,**/src/server.js,**/src/main.jsx

# LCOV files produced by `npm run test:ci` (paths are made repo-relative in the workflow).
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Hard-coded-credential rule: the tests deliberately contain dummy passwords (wrong/weak values the API must
# reject). Real code is still checked; production secrets come from environment variables / GitHub secrets.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/tests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/e2e/**
